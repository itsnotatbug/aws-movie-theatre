name: Release
on: { push: { branches: [main] } }
permissions: { id-token: write, contents: read }
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143050368559:role/gh-actions-deploy
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3

      # 1. Build locally and load into the runner's docker. Do NOT push yet.
      - id: build-local
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64           # match cluster node arch (t3.medium)
          load: true
          push: false
          tags: ${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ github.sha }}

      # 2. Scan the local image. A HIGH/CRITICAL finding fails the job
      #    before anything is pushed to ECR.
      - uses: aquasecurity/trivy-action@master
        with: { image-ref: "${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: 1 }

      # 3. Scan passed: push. Layers are reused from the buildx cache, so this
      #    does not actually rebuild. Capture the pushed digest for signing.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ github.sha }}

      # 4. Sign the exact pushed digest (not the tag) with cosign.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ steps.ecr.outputs.registry }}/aws-movie-theatre@${{ steps.push.outputs.digest }}
