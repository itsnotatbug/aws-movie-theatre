name: Release
on:
  push:
    branches: [main] # CI gate: build + scan, no push/sign
    tags: ["v*.*.*"] # Release: build + scan + push + sign
permissions: { id-token: write, contents: read }
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143050368559:role/gh-actions-deploy
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3

      # 0. Derive version + release flag from the git ref. This is why the
      #    workflow never changes per release: the tag name IS the version.
      #      refs/tags/v1.0.2 -> version=1.0.2, release=true
      #      refs/heads/main  -> version=<short-sha>, release=false (CI only)
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. Build locally and load into the runner's docker. Do NOT push yet.
      - id: build-local
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # match cluster node arch (t3.medium)
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ steps.meta.outputs.version }}

      # 2. Scan the local image. A HIGH/CRITICAL finding fails the job
      #    before anything is pushed to ECR. Runs on every main push too.
      - uses: aquasecurity/trivy-action@master
        with:
          {
            image-ref: "${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ steps.meta.outputs.version }}",
            severity: "HIGH,CRITICAL",
            exit-code: 1,
          }

      # 3. Scan passed: push. ONLY on version tags. Layers are reused from the
      #    buildx cache, so this does not actually rebuild. Capture the digest.
      - id: push
        if: steps.meta.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/aws-movie-theatre:${{ steps.meta.outputs.version }}

      # 4. Sign the exact pushed digest (not the tag) with cosign. ONLY on tags.
      - if: steps.meta.outputs.release == 'true'
        uses: sigstore/cosign-installer@v3
      - if: steps.meta.outputs.release == 'true'
        run: cosign sign --yes ${{ steps.ecr.outputs.registry }}/aws-movie-theatre@${{ steps.push.outputs.digest }}

      # 5. Generate the SBOM of the pushed image (Java libs + OS + JDK).
      - if: steps.meta.outputs.release == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ecr.outputs.registry }}/aws-movie-theatre@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # 6. Attest the SBOM to the exact digest with cosign (keyless, same OIDC
      #    identity as the signature). Stored as a registry artifact next to
      #    the .sig; verify/pull later with cosign verify-attestation.
      - if: steps.meta.outputs.release == 'true'
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json ${{ steps.ecr.outputs.registry }}/aws-movie-theatre@${{ steps.push.outputs.digest }}
